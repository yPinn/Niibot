# Staging overrides — isolated project (niibot-staging), loads staging env files.
# Ports offset from prod to avoid conflicts:
#   api 8001 | postgres 5434 | scrapling 3003 | instafix 3004

services:
  migrate:
    image: nb-api-stg
    container_name: nb-migrate-stg
    env_file:
      - ./backend/shared.staging.env
      - ./backend/api/.env.staging

  scrapling:
    image: nb-scrapling-stg
    container_name: nb-scrapling-stg
    ports:
      - "3003:${SCRAPLING_PORT:-3001}"
    env_file:
      - ./backend/scrapling/.env.staging

  twitch-bot:
    image: nb-twitch-stg
    container_name: nb-twitch-stg
    volumes:
      - ./data/staging/backend:/app/data
    env_file:
      - ./backend/shared.staging.env
      - ./backend/twitch/.env.staging

  discord-bot:
    image: nb-discord-stg
    container_name: nb-discord-stg
    volumes:
      - ./data/staging/backend:/app/data
    env_file:
      - ./backend/shared.staging.env
      - ./backend/discord/.env.staging

  api:
    image: nb-api-stg
    container_name: nb-api-stg
    ports:
      - "8001:8000"
    volumes:
      - ./data/staging/backend:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./backend/shared.staging.env
      - ./backend/api/.env.staging

  postgres:
    container_name: nb-pg-stg
    ports:
      - "5434:5432"
    volumes:
      - ./data/staging/postgres:/var/lib/postgresql/data

  instafix:
    container_name: nb-instafix-stg
    ports:
      - "3004:3000"
