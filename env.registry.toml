# ── API service ────────────────────────────────────────────────────────────

[[var]]
key = "JWT_SECRET_KEY"
scopes = ["api"]
section = "Auth"
description = "JWT 簽章金鑰"
help = '產生：python -c "import secrets; print(secrets.token_urlsafe(32))"'
required = true
[var.ci]
file = "api"
source = "secret:JWT_SECRET_KEY"
scope = "env"

[[var]]
key = "JWT_ALGORITHM"
scopes = ["api"]
section = "Auth"
description = "JWT 簽章演算法"
