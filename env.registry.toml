section = "Twitch"
description = "Twitch token Fernet 金鑰"
help = "初始化時產生；加密既有 token 後不可更換。"
required = true
[var.ci]
file = "shared"
source = "secret:TWITCH_TOKEN_ENCRYPTION_KEY"
scope = "env"

[[var]]
key = "BOT_ID"
scopes = ["shared"]
section = "Twitch"
description = "Twitch Bot user ID"
help = "填數字 ID；prod 與 nonprod 使用不同 bot 帳號。"
required = true
sensitive = false
nonprod_shared = true
[var.ci]
file = "shared"
source = "var:BOT_ID"
scope = "env"

[[var]]
key = "OWNER_ID"
scopes = ["shared"]
section = "Twitch"
description = "Twitch owner user ID"
required = true
sensitive = false
[var.ci]
file = "shared"
source = "var:OWNER_ID"
scope = "base"

[[var]]
key = "CONDUIT_ID"
scopes = ["twitch"]
section = "Twitch"
description = "選用：既有 EventSub Conduit ID"
commented = true
sensitive = false
[var.ci]
file = "twitch"
source = "var:CONDUIT_ID"
scope = "env"
conditional = true

