# ============================================================================
# Niibot env registry — SINGLE SOURCE OF TRUTH for every environment variable.
#
# Edit this file, then run:  npm run env:gen   (or: uv run --directory backend
# python ../scripts/gen_env.py)
#
# Generated from this file:
#   *.env.example (7 runtime templates)   .github/{secrets,variables}/*.env.example
#   docs/guides/environment.md tables      env.manifest.json
#
# Never edit a generated file by hand — CI (npm run env:check) will fail.
# ----------------------------------------------------------------------------
# Field reference for [[var]]:
#   key          registry-unique id (required). Also the ENV var name, unless
#                `name` is given (needed when the same ENV name — PORT — appears
#                in several service files).
#   name         actual ENV var name written to files / docs (default: key)
#   scopes       which runtime files it belongs to (required):
#                  root | shared | api | twitch | discord | scrapling | frontend
#   section      grouping header inside the example file (default "App")
#   description  one-liner for docs/guides/environment.md
#   default      value shown after "=" in the example (default "")
#   commented    true  → rendered as "# KEY=..." (optional hint)
#                false → rendered as "KEY=..." (fill before running)   [default false]
#   help         extra comment line printed above the key in the example.
#                Style: one short English sentence, sentence case, ending in a
#                period; use ";" for a second clause rather than a second
#                sentence. Where to obtain a value starts with "From ".
#                A command to run starts with "Generate: " and takes no
#                trailing period, so it stays copy-pasteable. Anything
#                longer than one line belongs in docs/guides/environment.md.
#   dev_hint     a "# Dev" section comment (e.g. "KEY=http://localhost:8000")
#   required     listed in the CI/CD deploy MISSING-secrets check          [default false]
#   sensitive    true  → GitHub Secret,  false → GitHub Variable         [default true]
#   ci.file      target env file the deploy workflow writes it into
#                  (root|shared|api|twitch|discord) — omit if not CI-managed
#   ci.source    "secret:NAME" | "var:NAME" | "derived:db_url"
#   ci.scope     "base" (repo-level) | "env" (prod + staging)   [default "base"]
#   ci.conditional  only write the line when the value is non-empty   [default false]
#   ci_example   per-environment placeholder shown in .github/*.env.example
#                  { base = "...", prod = "...", staging = "..." }
#                  (variables fall back to `default`; secrets to empty)
# ============================================================================

[meta]
# Order sections appear in every generated example file.
section_order = [
  "Database", "App", "Auth", "Twitch", "Discord", "Presence",
  "AI", "Service", "Integrations", "Monitoring", "Deployment", "Dev",
]
db_url_template = "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

# ── Database ────────────────────────────────────────────────────────────────

[[var]]
key = "POSTGRES_USER"
scopes = ["root"]
section = "Database"
description = "Postgres 容器初始帳號"
required = true
[var.ci]
file = "root"
source = "secret:POSTGRES_USER"
scope = "env"

[[var]]
key = "POSTGRES_PASSWORD"
scopes = ["root"]
section = "Database"
description = "Postgres 容器初始密碼"
required = true
[var.ci]
file = "root"
source = "secret:POSTGRES_PASSWORD"
scope = "env"

[[var]]
key = "POSTGRES_DB"
scopes = ["root"]
section = "Database"
description = "Postgres 容器初始資料庫名"
required = true
[var.ci]
file = "root"
source = "secret:POSTGRES_DB"
scope = "env"

[[var]]
key = "DOCKER_DATABASE_URL"
scopes = ["root"]
section = "Database"
description = "容器內連線字串，格式 postgresql://USER:PASSWORD@postgres:5432/DB"
help = "In-container URL — host is the compose service name, not localhost."
[var.ci]
file = "root"
source = "derived:db_url"
scope = "env"

[[var]]
key = "DATABASE_URL"
scopes = ["shared"]
section = "Database"
description = "本機直跑時的連線字串（Docker 內由 DOCKER_DATABASE_URL 覆蓋）"
default = "postgresql://USER:PASSWORD@localhost:5433/niibot"
help = "Local runs only; inside Docker this is overridden by DOCKER_DATABASE_URL."
[var.ci]
file = "shared"
source = "derived:db_url"
scope = "env"

# ── App / shared ───────────────────────────────────────────────────────────

[[var]]
key = "FRONTEND_URL"
scopes = ["shared"]
section = "App"
description = "OAuth redirect origin、CORS allow-list，以及 Discord Tarot embed 的公開牌圖 base URL（api／twitch／discord 共用）"
required = true
dev_hint = "FRONTEND_URL=http://localhost:3000"
[var.ci]
file = "shared"
source = "secret:FRONTEND_URL"
scope = "env"

# ── Twitch ─────────────────────────────────────────────────────────────────

[[var]]
key = "TWITCH_CLIENT_ID"
scopes = ["shared"]
section = "Twitch"
description = "Twitch App Client ID（dev.twitch.tv/console）"
help = "From dev.twitch.tv/console."
required = true
[var.ci]
file = "shared"
source = "secret:TWITCH_CLIENT_ID"
scope = "env"

[[var]]
key = "TWITCH_CLIENT_SECRET"
scopes = ["shared"]
section = "Twitch"
description = "Twitch App Client Secret"
required = true
[var.ci]
file = "shared"
source = "secret:TWITCH_CLIENT_SECRET"
scope = "env"

[[var]]
key = "TWITCH_TOKEN_ENCRYPTION_KEY"
scopes = ["shared"]
section = "Twitch"
description = "Twitch OAuth access／refresh token 的版本化 Fernet 加密金鑰"
help = 'Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"'
required = true
[var.ci]
file = "shared"
source = "secret:TWITCH_TOKEN_ENCRYPTION_KEY"
scope = "env"

[[var]]
key = "BOT_ID"
scopes = ["shared"]
section = "Twitch"
description = "Bot 的 Twitch user ID（id.twitch.tv）"
help = "Numeric Twitch user IDs, not usernames."
required = true
[var.ci]
file = "shared"
source = "secret:BOT_ID"
scope = "base"  # shared Twitch bot account — same user ID in prod and staging

[[var]]
key = "OWNER_ID"
scopes = ["shared"]
section = "Twitch"
description = "擁有者的 Twitch user ID"
required = true
[var.ci]
file = "shared"
source = "secret:OWNER_ID"
scope = "base"  # same owner account across environments

[[var]]
key = "CONDUIT_ID"
scopes = ["twitch"]
section = "Twitch"
description = "(選用) 重用既有 EventSub conduit"
commented = true
[var.ci]
file = "twitch"
source = "secret:CONDUIT_ID"
scope = "env"
conditional = true

# ── AI providers (shared) ──────────────────────────────────────────────────

[[var]]
key = "GROQ_API_KEY"
scopes = ["shared"]
section = "AI"
description = "AI provider（Twitch／Discord 預設首選）"
help = "Set at least one provider key and its explicit model. Twitch: Groq → OpenRouter; Discord: Groq → Gemini → OpenRouter."
[var.ci]
file = "shared"
source = "secret:GROQ_API_KEY"
scope = "base"
conditional = true

[[var]]
key = "GROQ_MODEL"
scopes = ["shared"]
section = "AI"
description = "Groq 模型（設定 GROQ_API_KEY 時必填）"
default = "openai/gpt-oss-120b"
commented = true
sensitive = false
[var.ci]
file = "shared"
source = "secret:GROQ_MODEL"
scope = "base"
conditional = true

[[var]]
key = "GEMINI_API_KEY"
scopes = ["shared"]
section = "AI"
description = "AI provider（AI Studio key，非 GCP service account）"
help = "From aistudio.google.com; not a GCP service account."
[var.ci]
file = "shared"
source = "secret:GEMINI_API_KEY"
scope = "base"
conditional = true

[[var]]
key = "GEMINI_MODEL"
scopes = ["shared"]
section = "AI"
description = "Gemini 模型（設定 GEMINI_API_KEY 時必填）"
default = "gemini-3.5-flash"
commented = true
sensitive = false
[var.ci]
file = "shared"
source = "secret:GEMINI_MODEL"
scope = "base"
conditional = true

[[var]]
key = "OPENROUTER_API_KEY"
scopes = ["shared"]
section = "AI"
description = "AI provider（free-tier 備援）"
[var.ci]
file = "shared"
source = "secret:OPENROUTER_API_KEY"
scope = "base"
conditional = true

[[var]]
key = "OPENROUTER_MODEL"
scopes = ["shared"]
section = "AI"
description = "OpenRouter 免費模型（設定 OPENROUTER_API_KEY 時必填）"
default = "inclusionai/ling-3.0-flash-vl:free"
commented = true
[var.ci]
file = "shared"
source = "secret:OPENROUTER_MODEL"
scope = "base"
conditional = true

# ── Integrations (shared) ──────────────────────────────────────────────────

[[var]]
key = "YOUTUBE_API_KEY"
scopes = ["shared"]
section = "Integrations"
description = "影片佇列查片長／觀看數"
[var.ci]
file = "shared"
source = "secret:YOUTUBE_API_KEY"
scope = "base"
conditional = true

# ── Monitoring (shared, inherited by every service) ────────────────────────

[[var]]
key = "ERROR_WEBHOOK_URL"
scopes = ["shared"]
section = "Monitoring"
description = "(選用) ERROR 以上 log 推送的 Discord webhook（於 shared.env 設一次，三服務共用）"
commented = true
[var.ci]
file = "shared"
source = "secret:ERROR_WEBHOOK_URL"
scope = "env"
conditional = true

# ── API service ────────────────────────────────────────────────────────────

[[var]]
key = "JWT_SECRET_KEY"
scopes = ["api"]
section = "Auth"
description = "JWT 簽章密鑰"
help = 'Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"'
required = true
[var.ci]
file = "api"
source = "secret:JWT_SECRET_KEY"
scope = "env"

[[var]]
key = "JWT_ALGORITHM"
scopes = ["api"]
section = "Auth"
description = "(選用) 預設 HS256"
default = "HS256"
commented = true
sensitive = false

[[var]]
key = "JWT_EXPIRE_DAYS"
scopes = ["api"]
section = "Auth"
description = "(選用) 預設 7"
default = "7"
commented = true
sensitive = false

[[var]]
key = "PAYMENT_ENCRYPTION_KEY"
scopes = ["api"]
section = "Auth"
description = "金流設定加密（Fernet key）"
help = 'Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"'
[var.ci]
file = "api"
source = "secret:PAYMENT_ENCRYPTION_KEY"
scope = "env"
conditional = true

[[var]]
key = "API_URL"
scopes = ["api"]
section = "App"
description = "對外 URL，用於 OAuth redirect 與 webhook callback"
sensitive = false
dev_hint = "API_URL=http://localhost:8000"
[var.ci]
file = "api"
source = "var:API_URL"
scope = "env"
[var.ci_example]
prod = "https://niibot.llazypilot.com"

[[var]]
key = "ENVIRONMENT"
scopes = ["shared"]
section = "App"
description = "production / development（api/twitch/discord 共用，經 config_base）"
default = "production"
sensitive = false
dev_hint = "ENVIRONMENT=development"
[var.ci]
file = "shared"
source = "var:ENVIRONMENT"
scope = "env"
[var.ci_example]
base = ""
prod = "production"
staging = "staging"

[[var]]
key = "RELEASES_GITHUB_TOKEN"
scopes = ["api"]
section = "Integrations"
description = "(選用) 讀 private repo release，read:contents scope"
help = "From github.com/settings/tokens; needs read:contents scope."
commented = true
[var.ci]
file = "api"
source = "secret:RELEASES_GITHUB_TOKEN"
scope = "base"
conditional = true

[[var]]
key = "NIGHTBOT_CLIENT_ID"
scopes = ["api"]
section = "Integrations"
description = "(選用) Nightbot 指令匯入；未設定時該來源不會出現在後台"
help = "From nightbot.tv/account/applications; one app per environment."
commented = true
[var.ci]
file = "api"
source = "secret:NIGHTBOT_CLIENT_ID"
scope = "env"
conditional = true

[[var]]
key = "NIGHTBOT_CLIENT_SECRET"
scopes = ["api"]
section = "Integrations"
description = "(選用) Nightbot 指令匯入用的 client secret"
commented = true
[var.ci]
file = "api"
source = "secret:NIGHTBOT_CLIENT_SECRET"
scope = "env"
conditional = true

[[var]]
key = "DISCORD_PUBLIC_KEY"
scopes = ["api"]
section = "Integrations"
description = "Discord 互動 webhook 簽章驗證（Developer Portal → General Information）"
help = "From Developer Portal → General Information → Public Key."
commented = true
[var.ci]
file = "api"
source = "secret:DISCORD_PUBLIC_KEY"
scope = "env"
conditional = true

# ── Discord bot ────────────────────────────────────────────────────────────

[[var]]
key = "DISCORD_BOT_TOKEN"
scopes = ["discord"]
section = "Discord"
description = "Bot token"
required = true
[var.ci]
file = "discord"
source = "secret:DISCORD_BOT_TOKEN"
scope = "env"

[[var]]
key = "DISCORD_STATUS"
scopes = ["discord"]
section = "Presence"
description = "online / idle / dnd / invisible"
default = "online"
sensitive = false
dev_hint = "DISCORD_STATUS=dnd"
[var.ci]
file = "discord"
source = "var:DISCORD_STATUS"
scope = "env"
[var.ci_example]
base = "idle"
prod = "online"
staging = "dnd"

[[var]]
key = "DISCORD_ACTIVITY_TYPE"
scopes = ["discord"]
section = "Presence"
description = "playing / listening / watching / competing / streaming / custom"
default = "playing"
sensitive = false
[var.ci]
file = "discord"
source = "var:DISCORD_ACTIVITY_TYPE"
scope = "env"
[var.ci_example]
base = "custom"
prod = "streaming"
staging = "listening"

[[var]]
key = "DISCORD_ACTIVITY_NAME"
scopes = ["discord"]
section = "Presence"
description = "狀態文字"
sensitive = false
[var.ci]
file = "discord"
source = "var:DISCORD_ACTIVITY_NAME"
scope = "env"
conditional = true
[var.ci_example]
base = "正在把牛變成鱒魚..."
prod = "尖尖哇嘎奈..."
staging = "STYX HELIX"

[[var]]
key = "DISCORD_ACTIVITY_URL"
scopes = ["discord"]
section = "Presence"
description = "(選用) streaming 型態限定，須為 twitch.tv URL"
help = "Streaming type only; must be a twitch.tv URL."
commented = true
sensitive = false
[var.ci]
file = "discord"
source = "var:DISCORD_ACTIVITY_URL"
scope = "env"
conditional = true
[var.ci_example]
prod = "https://www.twitch.tv/llazypilot"

[[var]]
key = "DISCORD_DESCRIPTION"
scopes = ["discord"]
section = "Discord"
description = "(選用) 覆蓋 Developer Portal 的 bio，上限 400 字"
help = "Overrides Developer Portal bio (max 400 chars)."
commented = true

[[var]]
key = "INSTAGRAM_SESSION_ID"
scopes = ["discord"]
section = "Integrations"
description = "(選用) Instagram 個人頁 embed，約 90 天效期"
help = "From the instagram.com 'sessionid' cookie; ~90-day expiry."
commented = true
[var.ci]
file = "discord"
source = "secret:INSTAGRAM_SESSION_ID"
scope = "base"
conditional = true

[[var]]
key = "DISCORD_SYNC_COMMANDS"
scopes = ["discord"]
section = "Dev"
description = "(選用) 增改 slash command 後設一次 true"
help = "Set once after adding/changing slash commands."
dev_hint = "DISCORD_SYNC_COMMANDS=true"
sensitive = false

[[var]]
key = "DISCORD_GUILD_ID"
scopes = ["discord"]
section = "Dev"
description = "(選用) 指定 guild 同步，較快"
help = "Guild-scoped command sync (faster than global)."
dev_hint = "DISCORD_GUILD_ID="
sensitive = false

[[var]]
key = "INSTAFIX_HOST"
scopes = ["shared"]
section = "Dev"
description = "(dev) Instagram OG proxy，Docker 由 compose 設定；api/twitch/discord 共用"
help = "Docker sets this; only needed for direct-run."
dev_hint = "INSTAFIX_HOST=localhost:3000"
sensitive = false

[[var]]
key = "SCRAPLING_HOST"
scopes = ["discord"]
section = "Dev"
description = "(選用) Threads sidecar；空值＝停用"
help = "Threads sidecar host; empty = disabled."
dev_hint = "SCRAPLING_HOST=localhost:3001"
sensitive = false

# ── LOG_LEVEL (shared by api/twitch/discord via config_base) ───────────────

[[var]]
key = "LOG_LEVEL"
scopes = ["shared"]
section = "Dev"
description = "log 等級，預設 INFO（api/twitch/discord 共用）"
default = "INFO"
sensitive = false
dev_hint = "LOG_LEVEL=DEBUG"
[var.ci]
file = "shared"
source = "var:LOG_LEVEL"
scope = "base"

# ── Health-server ports (dev-only; Docker sets them via compose) ────────────

[[var]]
key = "TWITCH_PORT"
name = "PORT"
scopes = ["twitch"]
section = "Dev"
description = "(dev) twitch-bot health server，預設 4344"
dev_hint = "PORT=4344"
sensitive = false

[[var]]
key = "DISCORD_PORT"
name = "PORT"
scopes = ["discord"]
section = "Dev"
description = "(dev) discord-bot health server，預設 8080"
dev_hint = "PORT=8080"
sensitive = false

# ── Scrapling sidecar ──────────────────────────────────────────────────────

[[var]]
key = "SCRAPLING_PORT"
name = "PORT"
scopes = ["scrapling"]
section = "Service"
description = "scrapling 服務埠，預設 3001"
default = "3001"
sensitive = false

[[var]]
key = "SCRAPLING_ENVIRONMENT"
name = "ENVIRONMENT"
scopes = ["scrapling"]
section = "Service"
description = "production 才啟用 ERROR_WEBHOOK_URL"
default = "production"
sensitive = false
dev_hint = "ENVIRONMENT=development"

[[var]]
key = "SCRAPLING_LOG_LEVEL"
name = "LOG_LEVEL"
scopes = ["scrapling"]
section = "Service"
description = "預設 INFO"
default = "INFO"
sensitive = false
dev_hint = "LOG_LEVEL=DEBUG"

[[var]]
key = "SCRAPLING_ERROR_WEBHOOK_URL"
name = "ERROR_WEBHOOK_URL"
scopes = ["scrapling"]
section = "Monitoring"
description = "(選用) ENVIRONMENT=production 時的錯誤推送 webhook"
commented = true
sensitive = false

[[var]]
key = "THREADS_SESSION_ID"
scopes = ["scrapling"]
section = "Service"
description = "threads.com 的 sessionid cookie，約 90 天效期"
help = "From the threads.com 'sessionid' cookie (DevTools → Application → Cookies); ~90-day expiry."
# Consumed only by the scrapling sidecar, which is deployed outside this
# compose stack — registered as a known secret but written to no runtime file.
[var.ci]
source = "secret:THREADS_SESSION_ID"
scope = "base"
conditional = true

# ── Frontend (Vite, build-time) ────────────────────────────────────────────

[[var]]
key = "VITE_BOT_USERNAME"
scopes = ["frontend"]
section = "App"
description = "Bot 帳號名，抑制自身的「授予 Mod」提示"
default = "niibot_"
sensitive = false

[[var]]
key = "VITE_DISCORD_COMMUNITY_URL"
scopes = ["frontend"]
section = "App"
description = "Discord 社群邀請連結（側欄／說明橫幅／條款頁）"
sensitive = false

[[var]]
key = "VITE_DISCORD_BOT_INVITE_URL"
scopes = ["frontend"]
section = "App"
description = "把 Bot 加入自己伺服器的 OAuth 連結"
sensitive = false

[[var]]
key = "VITE_SUPPORT_ECPAY_URL"
scopes = ["frontend"]
section = "App"
description = "贊助頁 ECPay 連結"
sensitive = false

[[var]]
key = "VITE_ENVIRONMENT"
name = "VITE_ENVIRONMENT"
scopes = ["frontend"]
section = "Deployment"
description = "(選用) production 鎖定 WIP 頁面；staging / dev 不鎖"
help = "'production' locks WIP pages; 'staging' or unset keeps them visible."
default = "production"
commented = true
sensitive = false

[[var]]
key = "VITE_API_URL"
scopes = ["frontend"]
section = "Dev"
description = "(dev) 開發伺服器代理目標；正式部署不設"
help = "Dev server proxy target; unset in production."
dev_hint = "VITE_API_URL=http://localhost:8000"
sensitive = false

# ── CI/CD runner only (GitHub Variables, no runtime env file) ──────────────

[[var]]
key = "PROJECT_DIR"
scopes = []
section = "Deployment"
description = "self-hosted runner 上的 repo 路徑"
sensitive = false
[var.ci]
source = "var:PROJECT_DIR"
scope = "env"

[[var]]
key = "DEPLOY_WEBHOOK_URL"
scopes = []
section = "Monitoring"
description = "CI/CD 部署失敗通知的 Discord webhook（與 ERROR_WEBHOOK_URL 不同頻道）"
[var.ci]
source = "secret:DEPLOY_WEBHOOK_URL"
scope = "env"
