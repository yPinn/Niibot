# 環境設定唯一來源。修改後執行 `npm run env:gen`。
# 產生 runtime／GitHub examples、manifest 與環境文件。
#
# [[var]] fields:
#   key/name       registry key／輸出的 env 名稱
#   scopes         產生到哪些 runtime env
#   section        產生區段；description 用於文件
#   default        範例值；commented=true 表示選用
#   help/dev_hint  範例中的簡短提示
#   required       部署前必填
#   sensitive      true=Secret，false=Variable
#   group           必須完整設定的一組選用值
#   activates_group true=此值存在時啟用 group
#   ci.*           GitHub 值來源、scope 與輸出檔
#   ci_example     prod／staging 範例值

[meta]
# Order sections appear in every generated example file.
section_order = [
  "Database", "App", "Auth", "Twitch", "Discord", "Presence",
  "AI", "Service", "Integrations", "Monitoring", "Deployment", "Dev",
]
# ── Database ────────────────────────────────────────────────────────────────

[[var]]
key = "POSTGRES_USER"
scopes = ["root"]
section = "Database"
description = "PostgreSQL 帳號"
required = true
sensitive = false
[var.ci]
file = "root"
source = "var:POSTGRES_USER"
scope = "env"

[[var]]
key = "POSTGRES_PASSWORD"
scopes = ["root"]
section = "Database"
description = "PostgreSQL 密碼"
required = true
[var.ci]
file = "root"
source = "secret:POSTGRES_PASSWORD"
scope = "env"

[[var]]
key = "POSTGRES_DB"
scopes = ["root"]
section = "Database"
description = "PostgreSQL 資料庫"
required = true
sensitive = false
[var.ci]
file = "root"
source = "var:POSTGRES_DB"
scope = "env"

[[var]]
key = "DOCKER_DATABASE_URL"
scopes = ["root"]
section = "Database"
description = "容器內 PostgreSQL URL"
help = "容器 host 固定為 postgres，不可使用 localhost。"
default = 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}'
[var.ci]
file = "root"
source = "derived:db_url"
scope = "env"

[[var]]
key = "DATABASE_URL"
scopes = ["shared"]
section = "Database"
description = "本機 PostgreSQL URL"
default = "postgresql://USER:PASSWORD@localhost:5432/niibot"
help = "僅供本機直跑；容器改用 DOCKER_DATABASE_URL。"
[var.ci]
file = "shared"
source = "derived:db_url"
scope = "env"

# ── App / shared ───────────────────────────────────────────────────────────

[[var]]
key = "FRONTEND_URL"
scopes = ["shared"]
section = "App"
description = "前端公開 URL"
help = "供 CORS、OAuth redirect 與公開素材使用。"
required = true
sensitive = false
dev_hint = "FRONTEND_URL=http://localhost:3000"
[var.ci]
file = "shared"
source = "var:FRONTEND_URL"
scope = "env"

