# Production overrides — exposes API port for Cloudflare Tunnel, loads prod env files.

services:
  migrate:
    image: nb-api
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env

  scrapling:
    env_file:
      - ./backend/scrapling/.env

  twitch-bot:
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/shared.env
      - ./backend/twitch/.env

  discord-bot:
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/shared.env
      - ./backend/discord/.env

  api:
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env

  postgres:
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
