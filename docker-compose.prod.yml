# Production override — pull pre-built images from ghcr.io
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required vars (set in root .env):
#   APP_VERSION  — image tag, e.g. v1.2.3 (default: latest)
#   GHCR_OWNER   — github username lowercase (default: ypinn)

services:
  postgres:
    ports: !reset []  # do not expose DB port in production

  migrate:
    image: ghcr.io/${GHCR_OWNER:-ypinn}/niibot-api:${APP_VERSION:-latest}
    build: !reset {}
    env_file: !reset
      - ./backend/api/.env.prod

  twitch-bot:
    image: ghcr.io/${GHCR_OWNER:-ypinn}/niibot-twitch:${APP_VERSION:-latest}
    build: !reset {}
    env_file: !reset
      - ./backend/twitch/.env.prod

  discord-bot:
    image: ghcr.io/${GHCR_OWNER:-ypinn}/niibot-discord:${APP_VERSION:-latest}
    build: !reset {}
    env_file: !reset
      - ./backend/discord/.env.prod

  api:
    image: ghcr.io/${GHCR_OWNER:-ypinn}/niibot-api:${APP_VERSION:-latest}
    build: !reset {}
    env_file: !reset
      - ./backend/api/.env.prod
