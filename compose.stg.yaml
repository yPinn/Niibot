# Staging publishes only the loopback API used by the tunnel.

services:
  migrate:
    image: nb-api-stg

  twitch-bot:
    image: nb-twitch-stg
    volumes:
      - ./data/staging/runtime:/app/runtime

  discord-bot:
    image: nb-discord-stg
    volumes:
      - ./data/staging/runtime:/app/runtime

  api:
    image: nb-api-stg
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - ./data/staging/runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    volumes:
      - ./data/staging/postgres:/var/lib/postgresql/data

  instafix: {}
