<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <!-- ═══════════════════════════════════════════

    <!-- ═══════════════════════════════════════════

         ═══════════════════════════════════════════ -->
    <meta name="theme-color" content="#5865F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ═══════════════════════════════════════════

    <meta property="og:url" content="https://niibot.llazypilot.com/" />
    <meta property="og:image" content="https://niibot.llazypilot.com/images/Avatar.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Niibot avatar" />
    <meta property="og:locale" content="zh_TW" />

    <!-- ═══════════════════════════════════════════
         Twitter / X Cards
         ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="niibot.llazypilot.com" />
    <meta name="twitter:url" content="https://niibot.llazypilot.com/" />
    <meta name="twitter:title" content="Niibot | 泥爸" />
    <meta name="twitter:description" content="除了幫你上班，我什麼都能做。" />
    <meta name="twitter:image" content="https://niibot.llazypilot.com/images/Avatar.png" />
    <meta name="twitter:image:alt" content="Niibot avatar" />

    <!-- ═══════════════════════════════════════════
         Structured Data (JSON-LD)
         ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Niibot",
        "alternateName": "泥爸",
        "url": "https://niibot.llazypilot.com/",
        "description": "除了幫你上班，我什麼都能做。",
        "inLanguage": "zh-TW",
        "publisher": {
          "@type": "Organization",
          "name": "Niibot",
          "url": "https://niibot.llazypilot.com/",
          "logo": "https://niibot.llazypilot.com/images/Avatar.png"
        }
      }
    </script>

    <script>
      ;(function () {
        const theme = localStorage.getItem('vite-ui-theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
        } else if (theme === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.classList.toggle('light', !isDark)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
