<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <!-- ═══════════════════════════════════════════
         基礎 (Base)
         ═══════════════════════════════════════════ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niibot | 泥爸</title>
    <meta name="description" content="除了幫你上班，我什麼都能做。" />
    <meta name="author" content="Niibot" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://niibot.llazypilot.com/" />

    <!-- ═══════════════════════════════════════════
         Favicon & PWA Icons
         ═══════════════════════════════════════════ -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ═══════════════════════════════════════════
         主題色 (Theme Color)
         Android Chrome / Safari 15+ / PWA
         ═══════════════════════════════════════════ -->
    <meta name="theme-color" content="#5865F2" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#5865F2" media="(prefers-color-scheme: light)" />

    <!-- ═══════════════════════════════════════════
         Open Graph — Facebook / Discord / LINE
         ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niibot" />
    <meta property="og:title" content="Niibot | 泥爸" />
    <meta property="og:description" content="除了幫你上班，我什麼都能做。" />
    <meta property="og:url" content="https://niibot.llazypilot.com/" />
    <meta property="og:image" content="https://niibot.llazypilot.com/images/Avatar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Niibot avatar" />
    <meta property="og:locale" content="zh_TW" />

    <!-- ═══════════════════════════════════════════
         Twitter / X Cards
         ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="niibot.llazypilot.com" />
    <meta name="twitter:url" content="https://niibot.llazypilot.com/" />
    <meta name="twitter:title" content="Niibot | 泥爸" />
    <meta name="twitter:description" content="除了幫你上班，我什麼都能做。" />
    <meta name="twitter:image" content="https://niibot.llazypilot.com/images/Avatar.png" />
    <meta name="twitter:image:alt" content="Niibot avatar" />

    <script>
      ;(function () {
        const theme = localStorage.getItem('vite-ui-theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
        } else if (theme === 'system') {
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.classList.toggle('light', !isDark)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
