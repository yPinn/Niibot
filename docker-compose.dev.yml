# Dev overrides — exposes internal ports to the host for local inspection,
# and mounts frontend source for hot module replacement.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml [--profile <name>] up

services:
  postgres:
    ports:
      - "5433:5432" # 5433 avoids conflict with a local postgres installation

  instafix:
    ports:
      - "3002:3000" # 3002 avoids conflict with the frontend dev server on 3000

  scrapling:
    ports:
      - "3001:${SCRAPLING_PORT:-3001}"
