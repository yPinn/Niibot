# Dev overrides — exposes all ports to host for local inspection, uses same env files as prod.

services:
  migrate:
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env

  scrapling:
    ports:
      - "3001:${SCRAPLING_PORT:-3001}"
    env_file:
      - ./backend/scrapling/.env

  twitch-bot:
    volumes:
      - ./backend/runtime:/app/runtime
    env_file:
      - ./backend/shared.env
      - ./backend/twitch/.env

  discord-bot:
    volumes:
      - ./backend/runtime:/app/runtime
    env_file:
      - ./backend/shared.env
      - ./backend/discord/.env

  api:
    ports:
      - "8000:8000"
    volumes:
      - ./backend/runtime:/app/runtime
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env

  postgres:
    ports:
      - "5433:5432" # 5433 avoids conflict with a local postgres installation

  instafix:
    ports:
      - "3002:3000" # 3002 avoids conflict with the frontend dev server on 3000
