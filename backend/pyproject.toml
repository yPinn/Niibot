[project]
name = "niibot-backend"
version = "1.12"
description = "FastAPI backend for Discord and Twitch bots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0,<1.0.0",
    "cachetools>=7.0.1,<8.0.0",
    "discord-py>=2.6.0,<3.0.0",
    "fastapi>=0.139.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyjwt[crypto]>=2.13.0,<3.0.0",
    # cryptography is also imported directly (Fernet, ed25519, ciphers). From
    # 49.0.0 the macOS wheels are arm64-only; Intel Macs would compile from
    # source. Pin them to the 48.x line (last with a universal2 wheel); every
    # other platform (Linux prod, CI, Apple Silicon) tracks the latest.
    "cryptography>=48,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=48,<51; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "openai>=2.44.0,<3.0.0",
    "pydantic-settings>=2.13.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "rich>=14.0.0,<16.0.0",
    "structlog>=25.0.0,<26.0.0",
    "twitchio>=3.2.0,<4.0.0",
    "uvicorn[standard]>=0.51.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "aiohttp>=3.14.0,<4.0.0",
    "pillow>=12.3.0,<13.0.0",
    "pypinyin>=0.53.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".cache/ruff"
src = ["api", "discord", "twitch", "shared"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = [
    "E501",  # 行長由 formatter 處理
    "B008",  # 允許 FastAPI 的 Depends()
]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "cogs",
    "components",
    "config",
    "core",
    "database",
    "health_server",
    "http_server",
    "rate_limiter",
    "routers",
    "services",
    "shared",
    "utils",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy" # 集中管理快取
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

# --- 針對 Discord (cogs) 實施嚴格檢查 ---
[[tool.mypy.overrides]]
module = ["discord.*", "cogs.*"]
disallow_untyped_defs = true
warn_return_any = true

# --- 針對其他庫保持彈性 ---
[[tool.mypy.overrides]]
module = ["twitchio.*", "components.*", "asyncpg.*", "openai.*", "aiohttp.*"]
disallow_untyped_defs = false

# --- 測試檔案：mock 猴子補丁無法通過嚴格型別檢查，整體略過 ---
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "ruff>=0.15.20,<1.0.0",
    "types-aiofiles>=25.0.0",
    "types-cachetools>=7.0.0.20260713",
    "cachetools>=7.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.5.0",
]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:twitchio",
    "ignore::DeprecationWarning:discord",
    "ignore::DeprecationWarning:pypinyin",
    "ignore:Inheritance class AiohttpAdapter:DeprecationWarning",
]
