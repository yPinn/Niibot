name: CD

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/niibot-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER }}/niibot-api:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Twitch
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/twitch/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/niibot-twitch:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER }}/niibot-twitch:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=twitch
          cache-to: type=gha,scope=twitch,mode=max

      - name: Build & push Discord
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/discord/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/niibot-discord:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER }}/niibot-discord:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=discord
          cache-to: type=gha,scope=discord,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      APP_VERSION: ${{ needs.build-and-push.outputs.version }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_VERSION
          script: |
            set -e
            cd ~/niibot
            git pull origin main
            echo "Deploying $APP_VERSION ..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
            echo "Done: $APP_VERSION"
