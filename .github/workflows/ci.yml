name: CI

on:
  push:
    # staging is the single tested release-candidate branch. main only
    # receives a promotion after this exact tree has passed CI and staging.
    branches: [staging]
  pull_request:
    # Validate changes before they enter staging. The later staging -> main
    # promotion deliberately reuses the staging result instead of rerunning.
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Only supersede stale commits for the same pull request. Staging pushes use
# the unique run id so validation/deploy is never interrupted by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Preflight (Secrets, Env & Scope)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Verify env registry
        run: uv run --no-project python scripts/env/gen.py --check

      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--event "$EVENT_NAME")
          if [ "$PR_DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | python3 scripts/ci/paths.py "${args[@]}" \
              | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/paths.py "${args[@]}" </dev/null \
              | tee -a "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend Lint & Build
    needs: preflight
    if: needs.preflight.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build & Type check
        run: npm run build

      - name: Test
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npm run test -- --run
          else
            npm run test:cov -- --run
          fi

  backend:
    name: Backend Lint & Test
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: niibot_test
          POSTGRES_DB: niibot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niibot_test -d niibot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://niibot_test@127.0.0.1:5432/niibot_test
      NIIBOT_TEST_DATABASE_URL: postgresql://niibot_test@127.0.0.1:5432/niibot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Audit the environment actually installed on this platform, not the
      # lockfile universe. The Intel-Mac-only `cryptography>=48,<49` pin keeps
      # 48.x in the lock; auditing the export flagged it everywhere even though
      # Linux/CI/prod resolve to the current 50.x line.
      - name: Audit dependencies
        run: uv run --no-sync --with pip-audit pip-audit

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Mypy type check
        run: uv run mypy .

      - name: Migrate test database
        run: uv run python -m scripts.db.migrate

      - name: Run tests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run pytest tests/ -q --tb=short --durations=30
          else
            uv run pytest tests/ -q --tb=short --durations=30 \
              --cov --cov-report=term-missing
          fi

  deploy-staging:
    name: Deploy Staging
    needs: [preflight, frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/_deploy.yml
    with:
      # Staging is an integration target, so its API must represent the full
      # branch HEAD even when an earlier deploy was skipped or failed.
      environment: staging
      force_all: true
    secrets: inherit
