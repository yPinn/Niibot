name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:cov -- --run

      - name: Build & Type check
        run: npm run build

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-registry:
    name: Env Registry Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Templates, docs and manifest match env.registry.toml
        run: uv run --no-project python scripts/gen_env.py --check

  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: niibot_test
          POSTGRES_DB: niibot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niibot_test -d niibot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://niibot_test@127.0.0.1:5432/niibot_test
      NIIBOT_TEST_DATABASE_URL: postgresql://niibot_test@127.0.0.1:5432/niibot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Audit the environment actually installed on this platform, not the
      # lockfile universe. The Intel-Mac-only `cryptography>=48,<49` pin keeps
      # 48.x in the lock; auditing the export flagged it everywhere even though
      # Linux/CI/prod resolve to the current 50.x line.
      - name: Audit dependencies
        run: uv run --no-sync --with pip-audit pip-audit

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Migrate test database
        run: uv run python scripts/db_migrate.py

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing

      - name: Mypy type check
        run: uv run mypy .

  deploy-staging:
    name: Deploy Staging
    needs: [frontend, backend, secrets, env-registry]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
    secrets: inherit
