name: Deploy Staging

# Staging deployment — see _deploy.yml for the derived config.
# GitHub Environment "staging" overrides: API_URL, ENVIRONMENT, FRONTEND_URL, POSTGRES_DB
# Auto-deploy is handled by the deploy-staging job in ci.yml (push to staging → CI pass → deploy).
# This file is kept for manual workflow_dispatch — e.g. to spin up the staging bots for a test.

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Which services to deploy (default = api only)"
        type: choice
        options: [default, api, twitch, discord, "twitch,discord", all]
        default: default
      force_all:
        description: "Force rebuild + restart the resolved service set"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      services: ${{ inputs.services == 'default' && '' || inputs.services }}
      force_all: ${{ inputs.force_all == true }}
    secrets: inherit
