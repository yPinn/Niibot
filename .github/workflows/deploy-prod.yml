name: Deploy Prod

# Production deployment — see _deploy.yml for the derived config and the
# env.registry.toml single source of truth for secrets/variables.
# Triggered manually via workflow_dispatch or on the weekly schedule (base image updates).
# NOT triggered automatically on push — production deploys are intentional only.

on:
  schedule:
    - cron: "0 20 * * 2" # Every Tue 20:00 UTC (Wed 04:00 CST) — full rebuild for base image updates
  workflow_dispatch:
    inputs:
      services:
        description: "Which services to act on"
        type: choice
        options:
          [default, api, twitch, discord, instafix, "twitch,discord", all]
        default: default
      force_all:
        description: "Force rebuild + restart the resolved service set"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      services: ${{ inputs.services }} # "" on schedule, "default" on dispatch — both handled in _deploy.yml
      force_all: ${{ inputs.force_all == true }}
      is_scheduled: ${{ github.event_name == 'schedule' }}
    secrets: inherit
