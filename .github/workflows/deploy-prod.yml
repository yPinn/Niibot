name: Deploy Prod

# Production deployment — see _deploy.yml for secrets/variables reference.
# Triggered automatically after CI passes on main, or manually via workflow_dispatch.

on:
  schedule:
    - cron: "0 20 * * 2" # Every Tue 20:00 UTC (Wed 04:00 CST) — full rebuild for base image updates
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild and restart all services"
        type: boolean
        default: false
      deploy_api:
        description: "Force restart API"
        type: boolean
        default: false
      deploy_twitch:
        description: "Force restart Twitch bot"
        type: boolean
        default: false
      deploy_discord:
        description: "Force restart Discord bot"
        type: boolean
        default: false
      deploy_scrapling:
        description: "Force restart Scrapling"
        type: boolean
        default: false
      deploy_instafix:
        description: "Pull and restart Instafix"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      env_suffix: ""
      compose_env_file: docker-compose.prod.yml
      compose_project: ""
      branch: main
      api_port: 8000
      scrapling_port_default: 3001
      compose_change_pattern: docker-compose.prod.yml
      force_all: ${{ inputs.force_all == true }}
      force_api: ${{ inputs.deploy_api == true }}
      force_twitch: ${{ inputs.deploy_twitch == true }}
      force_discord: ${{ inputs.deploy_discord == true }}
      force_scrapling: ${{ inputs.deploy_scrapling == true }}
      force_instafix: ${{ inputs.deploy_instafix == true }}
      is_scheduled: ${{ github.event_name == 'schedule' }}
      tag_images: true
      prune_full: true
      pull_on_force: true
    secrets: inherit
