name: Deploy

# ─── GitHub Secrets required ──────────────────────────────────────────────────
# Settings → Secrets and variables → Actions → Repository secrets:
#   POSTGRES_USER          — PostgreSQL username
#   POSTGRES_PASSWORD      — PostgreSQL password
#   POSTGRES_DB            — PostgreSQL database name
#   FRONTEND_URL           — Production frontend URL (OAuth redirect + CORS)
#   TWITCH_CLIENT_ID       — Twitch app Client ID (dev.twitch.tv)
#   TWITCH_CLIENT_SECRET   — Twitch app Client Secret
#   JWT_SECRET_KEY         — API JWT signing secret (python -c "import secrets; print(secrets.token_urlsafe(32))")
#   DISCORD_BOT_TOKEN      — Discord bot token (discord.com/developers)
#   BOT_ID                 — Twitch bot user ID
#   OWNER_ID               — Twitch channel owner user ID
#
# Optional secrets (leave unset to disable the feature):
#   YOUTUBE_API_KEY        — YouTube Data API v3
#   GROQ_API_KEY           — Groq AI (free tier, console.groq.com)
#   GEMINI_API_KEY         — Gemini AI Studio (free tier, aistudio.google.com)
#   OPENROUTER_API_KEY     — OpenRouter AI
#   OPENROUTER_MODEL       — OpenRouter primary model name
#   INSTAGRAM_SESSION_ID   — Instagram session cookie (~90-day expiry)
#   THREADS_SESSION_ID     — Threads session cookie (~90-day expiry)
#   CONDUIT_ID             — Twitch EventSub conduit ID
#   ERROR_WEBHOOK_URL      — Discord webhook for ERROR/CRITICAL alerts
#
# GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   API_URL                — Production API base URL (e.g. https://api.example.com)
#   ENVIRONMENT            — Deployment environment (default: production)
#   LOG_LEVEL              — Log level override (default: INFO)
#   DISCORD_STATUS         — Bot presence status (default: online)
#   DISCORD_ACTIVITY_TYPE  — Activity type: playing/watching/listening (default: playing)
#   DISCORD_ACTIVITY_NAME  — Activity display name (optional)
#   DISCORD_ACTIVITY_URL   — Streaming URL — twitch.tv only (optional)
#   SCRAPLING_PORT         — Scrapling sidecar port (default: 3001)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 2" # Every Tue 20:00 UTC (Wed 04:00 CST) — full rebuild for base image updates
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild and restart all services"
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Mac
    runs-on: self-hosted
    concurrency:
      group: deploy
      cancel-in-progress: false # never interrupt a deploy mid-run (risk of partial migration)

    env:
      PROJECT_DIR: /Users/pinn/Niibot

    steps:
      - name: Write env files from secrets
        env:
          # Required secrets
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BOT_ID: ${{ secrets.BOT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          # Optional secrets
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          THREADS_SESSION_ID: ${{ secrets.THREADS_SESSION_ID }}
          CONDUIT_ID: ${{ secrets.CONDUIT_ID }}
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
          # Non-sensitive variables
          API_URL: ${{ vars.API_URL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          DISCORD_STATUS: ${{ vars.DISCORD_STATUS || 'online' }}
          DISCORD_ACTIVITY_TYPE: ${{ vars.DISCORD_ACTIVITY_TYPE || 'playing' }}
          DISCORD_ACTIVITY_NAME: ${{ vars.DISCORD_ACTIVITY_NAME }}
          DISCORD_ACTIVITY_URL: ${{ vars.DISCORD_ACTIVITY_URL }}
          SCRAPLING_PORT: ${{ vars.SCRAPLING_PORT }}
        run: |
          # Validate required secrets are non-empty
          MISSING=""
          for VAR in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB FRONTEND_URL \
                     TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET JWT_SECRET_KEY \
                     DISCORD_BOT_TOKEN BOT_ID OWNER_ID; do
            [ -n "${!VAR}" ] || MISSING="$MISSING $VAR"
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing GitHub Secrets:$MISSING"
            echo "Configure at: Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Compute DB URL from Postgres credentials (same URL for both root .env and shared.env;
          # Docker Compose always uses DOCKER_DATABASE_URL to reach the postgres service container).
          DB_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"

          # --- Root .env (PostgreSQL + Docker Compose interpolation) ---
          {
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "DOCKER_DATABASE_URL=${DB_URL}"
            [ -n "${SCRAPLING_PORT}" ] && echo "SCRAPLING_PORT=${SCRAPLING_PORT}"
          } > "$PROJECT_DIR/.env"

          # --- Shared env (api + discord + twitch) ---
          {
            echo "DATABASE_URL=${DB_URL}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}"
            echo "TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}"
            echo "BOT_ID=${BOT_ID}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
            [ -n "${YOUTUBE_API_KEY}" ]    && echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY}"
            [ -n "${GROQ_API_KEY}" ]       && echo "GROQ_API_KEY=${GROQ_API_KEY}"
            [ -n "${GEMINI_API_KEY}" ]     && echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            [ -n "${OPENROUTER_API_KEY}" ] && echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            [ -n "${OPENROUTER_MODEL}" ]   && echo "OPENROUTER_MODEL=${OPENROUTER_MODEL}"
            [ -n "${ERROR_WEBHOOK_URL}" ]  && echo "ERROR_WEBHOOK_URL=${ERROR_WEBHOOK_URL}"
          } > "$PROJECT_DIR/backend/shared.env"

          # --- API .env ---
          {
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "API_URL=${API_URL}"
            echo "ENVIRONMENT=${ENVIRONMENT}"
          } > "$PROJECT_DIR/backend/api/.env"

          # --- Discord .env ---
          {
            echo "DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}"
            echo "DISCORD_STATUS=${DISCORD_STATUS}"
            echo "DISCORD_ACTIVITY_TYPE=${DISCORD_ACTIVITY_TYPE}"
            [ -n "${DISCORD_ACTIVITY_NAME}" ] && echo "DISCORD_ACTIVITY_NAME=${DISCORD_ACTIVITY_NAME}"
            [ -n "${DISCORD_ACTIVITY_URL}" ]  && echo "DISCORD_ACTIVITY_URL=${DISCORD_ACTIVITY_URL}"
            [ -n "${INSTAGRAM_SESSION_ID}" ]  && echo "INSTAGRAM_SESSION_ID=${INSTAGRAM_SESSION_ID}"
          } > "$PROJECT_DIR/backend/discord/.env"

          # --- Twitch .env ---
          {
            echo "OWNER_ID=${OWNER_ID}"
            [ -n "${CONDUIT_ID}" ] && echo "CONDUIT_ID=${CONDUIT_ID}"
          } > "$PROJECT_DIR/backend/twitch/.env"

          # --- Scrapling .env ---
          {
            echo "PORT=${SCRAPLING_PORT:-3001}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
            [ -n "${THREADS_SESSION_ID}" ] && echo "THREADS_SESSION_ID=${THREADS_SESSION_ID}"
            [ -n "${ERROR_WEBHOOK_URL}" ]  && echo "ERROR_WEBHOOK_URL=${ERROR_WEBHOOK_URL}"
          } > "$PROJECT_DIR/backend/scrapling/.env"

          echo "Env files written."

      - name: Pull latest code
        run: |
          git -C $PROJECT_DIR fetch --force --tags origin main
          git -C $PROJECT_DIR reset --hard origin/main

      - name: Set build metadata
        id: meta
        run: |
          COMMIT=$(git -C $PROJECT_DIR rev-parse --short HEAD)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          RAW=$(git -C $PROJECT_DIR describe --tags --always 2>/dev/null || echo "dev")
          # Old 3-segment tags:  v1.3.2-9-g32f0417 → v1.3.9 (32f0417)
          # New 2-segment tags:  v1.4-9-g32f0417   → v1.4.9 (32f0417)
          # Exact 3-segment tag: v1.3.2             → v1.3.0 (sha)
          # Exact 2-segment tag: v1.4               → v1.4.0 (sha)
          VERSION=$(echo "$RAW" | sed -E \
            -e 's/^v([0-9]+)\.([0-9]+)\.[0-9]+-([0-9]+)-g([0-9a-f]+)$/v\1.\2.\3 (\4)/' \
            -e 's/^v([0-9]+)\.([0-9]+)-([0-9]+)-g([0-9a-f]+)$/v\1.\2.\3 (\4)/' \
            -e 's/^v([0-9]+)\.([0-9]+)\.[0-9]+$/v\1.\2.0 ('"$COMMIT"')/' \
            -e 's/^v([0-9]+)\.([0-9]+)$/v\1.\2.0 ('"$COMMIT"')/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect changed services
        id: changes
        run: |
          cd $PROJECT_DIR

          FORCE="${{ github.event.inputs.force_all || 'false' }}"
          BASE_SHA="${{ github.event.before }}"
          CHANGED=$(git diff --name-only "${BASE_SHA}" HEAD 2>/dev/null) || true

          # Scheduled run → always full rebuild (picks up base image security updates)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE="true"
          fi

          # Force mode or can't determine diff → rebuild everything
          if [ "$FORCE" = "true" ] || [ -z "$CHANGED" ]; then
            echo "api=true"       >> $GITHUB_OUTPUT
            echo "discord=true"   >> $GITHUB_OUTPUT
            echo "twitch=true"    >> $GITHUB_OUTPUT
            echo "scrapling=true" >> $GITHUB_OUTPUT
            echo "reason=force"   >> $GITHUB_OUTPUT
            exit 0
          fi

          api=false; discord=false; twitch=false; scrapling=false

          # shared/ and compose file affect api + bots (scrapling has no shared dependency)
          if echo "$CHANGED" | grep -qE "^backend/shared/|^backend/shared\.env|^docker-compose\.yml"; then
            api=true; discord=true; twitch=true
          fi

          echo "$CHANGED" | grep -qE "^backend/api/"       && api=true       || true
          echo "$CHANGED" | grep -qE "^backend/discord/"   && discord=true   || true
          echo "$CHANGED" | grep -qE "^backend/twitch/"    && twitch=true    || true
          echo "$CHANGED" | grep -qE "^backend/scrapling/" && scrapling=true || true

          echo "api=$api"             >> $GITHUB_OUTPUT
          echo "discord=$discord"     >> $GITHUB_OUTPUT
          echo "twitch=$twitch"       >> $GITHUB_OUTPUT
          echo "scrapling=$scrapling" >> $GITHUB_OUTPUT
          echo "reason=path_filter"   >> $GITHUB_OUTPUT

      - name: Log planned changes
        run: |
          echo "api=${{ steps.changes.outputs.api }}"
          echo "discord=${{ steps.changes.outputs.discord }}"
          echo "twitch=${{ steps.changes.outputs.twitch }}"
          echo "scrapling=${{ steps.changes.outputs.scrapling }}"
          echo "reason=${{ steps.changes.outputs.reason }}"

      - name: Build images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICES=""
          [ "${{ steps.changes.outputs.api }}" = "true" ]       && SERVICES="$SERVICES api"
          [ "${{ steps.changes.outputs.discord }}" = "true" ]   && SERVICES="$SERVICES discord-bot"
          [ "${{ steps.changes.outputs.twitch }}" = "true" ]    && SERVICES="$SERVICES twitch-bot"
          [ "${{ steps.changes.outputs.scrapling }}" = "true" ] && SERVICES="$SERVICES scrapling"

          if [ -z "$SERVICES" ]; then
            echo "No images to build, skipping."
            exit 0
          fi

          echo "Building:$SERVICES"

          # --pull on scheduled/force runs so base image security updates are fetched.
          PULL_FLAG=""
          [ "${{ steps.changes.outputs.reason }}" = "force" ] && PULL_FLAG="--pull"

          docker compose build $PULL_FLAG $SERVICES \
            --build-arg "APP_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "GIT_COMMIT=${{ steps.meta.outputs.commit }}"

      - name: Tag images with version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          [ "${{ steps.changes.outputs.api }}" = "true" ]       && docker tag niibot-api      "niibot-api:$VERSION"      || true
          [ "${{ steps.changes.outputs.discord }}" = "true" ]   && docker tag niibot-discord  "niibot-discord:$VERSION"  || true
          [ "${{ steps.changes.outputs.twitch }}" = "true" ]    && docker tag niibot-twitch   "niibot-twitch:$VERSION"   || true
          [ "${{ steps.changes.outputs.scrapling }}" = "true" ] && docker tag niibot-scrapling "niibot-scrapling:$VERSION" || true
          echo "Tagged rebuilt images as :$VERSION"

      - name: Run migrations
        working-directory: ${{ env.PROJECT_DIR }}
        if: steps.changes.outputs.api == 'true'
        run: docker compose run --rm migrate

      - name: Restart changed services
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICES=""
          [ "${{ steps.changes.outputs.api }}" = "true" ]       && SERVICES="$SERVICES api"
          [ "${{ steps.changes.outputs.discord }}" = "true" ]   && SERVICES="$SERVICES discord-bot"
          [ "${{ steps.changes.outputs.twitch }}" = "true" ]    && SERVICES="$SERVICES twitch-bot"
          [ "${{ steps.changes.outputs.scrapling }}" = "true" ] && SERVICES="$SERVICES scrapling"

          if [ -z "$SERVICES" ]; then
            echo "No services to restart, skipping."
            exit 0
          fi

          echo "Restarting:$SERVICES"
          docker compose up -d $SERVICES

      - name: Health check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # Poll until the API responds (covers cold start + migration time after a rebuild).
          # Timeout 120s; print progress every 5s so the log shows what's happening.
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:8000/health > /dev/null; do
            if [ $SECONDS -ge $deadline ]; then
              echo "ERROR: API did not respond within 120s"
              docker compose ps
              docker compose logs api --tail=30
              exit 1
            fi
            echo "Waiting for API... (${SECONDS}s elapsed)"
            sleep 5
          done
          echo "API liveness: OK"

          # DB connectivity — hard failure
          if ! curl -sf http://localhost:8000/status | python3 -c \
            "import sys, json; d=json.load(sys.stdin); sys.exit(0 if d.get('db_connected') else 1)"; then
            echo "ERROR: API is up but db_connected=false"
            curl -s http://localhost:8000/status
            docker compose logs api --tail=30
            exit 1
          fi
          echo "API db_connected: OK"

          # Bots / scrapling — soft check (log warning only; gateway latency varies)
          curl -sf http://localhost:8080/health && echo "discord-bot: OK" || echo "WARN: discord-bot not responding"
          curl -sf http://localhost:4344/health && echo "twitch-bot:  OK" || echo "WARN: twitch-bot not responding"
          curl -sf "http://localhost:${SCRAPLING_PORT:-3001}/health" && echo "scrapling:   OK" || echo "WARN: scrapling not responding"

      - name: Prune old images
        run: |
          # Remove dangling images (untagged build leftovers)
          docker image prune -f

          # Keep only the 3 most recent version tags per service; remove the rest.
          # docker images lists newest-first by default — no sort needed (avoids
          # BSD sort -V incompatibility on macOS runners).
          for IMAGE in niibot-api niibot-twitch niibot-discord niibot-scrapling; do
            docker images "$IMAGE" --format "{{.Tag}}" \
              | grep -v "^latest$" \
              | tail -n +4 \
              | xargs -I{} docker rmi "$IMAGE:{}" 2>/dev/null || true
          done
