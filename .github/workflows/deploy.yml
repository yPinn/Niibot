name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Mac
    runs-on: self-hosted
    concurrency:
      group: deploy
      cancel-in-progress: true

    env:
      PROJECT_DIR: /Users/pinn/Niibot

    steps:
      - name: Pull latest code
        run: git -C $PROJECT_DIR pull

      - name: Set build metadata
        id: meta
        run: |
          echo "commit=$(git -C $PROJECT_DIR rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(git -C $PROJECT_DIR describe --tags --always 2>/dev/null || echo dev)" >> $GITHUB_OUTPUT

      - name: Build images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg GIT_COMMIT=${{ steps.meta.outputs.commit }}

      - name: Deploy
        working-directory: ${{ env.PROJECT_DIR }}
        run: docker compose up -d --force-recreate --remove-orphans

      - name: Health check
        run: |
          sleep 10
          curl -sf http://localhost:8000/health || exit 1
