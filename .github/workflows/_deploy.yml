# Reusable deploy workflow — called by deploy-prod.yml, deploy-staging.yml and
# the deploy-staging job in ci.yml.
#
# The only knob callers pass is `environment` (production | staging); every
# path / port / suffix / default service set is derived in the "Resolve
# environment config" step below.
#
# Env files on the runner are written by scripts/env/write_ci.sh from
# env.manifest.json (generated by scripts/env/gen.py ← env.registry.toml).
# The registry is the single source of truth for which secret/variable lands
# in which file — do not re-enumerate keys here.

on:
  workflow_call:
    inputs:
      environment:
        description: "production | staging — everything else is derived from this"
        type: string
        required: true
      services:
        description: >-
          Services to act on. Empty = the environment's default set
          (production: api twitch discord instafix; staging: api). Otherwise
          "all", or a comma list of api/twitch/discord/instafix. These are the
          workflow's own slugs, not Compose service names — the
          "Detect changed services" step maps them to twitch-bot/discord-bot.
        type: string
        default: ""
      force_all:
        description: "Rebuild + restart the whole resolved service set, skipping change detection"
        type: boolean
        default: false
      is_scheduled:
        description: "Weekly cron run — forces a full rebuild with --pull for base-image updates"
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy
      cancel-in-progress: false # never interrupt mid-run — partial migration would leave DB in broken state

    env:
      PROJECT_DIR: ${{ vars.PROJECT_DIR }}

    steps:
      - name: Resolve environment config
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            production)
              {
                echo "ENV_ALIAS=prod"
                echo "NIIBOT_ENV=prod"
                echo "COMPOSE_ENV_FILE=compose.prod.yaml"
                echo "COMPOSE_PROJECT=niibot-prod"
                echo "IMAGE_SUFFIX=-prod"
                echo "API_PORT=18000"
                echo "DEPLOY_BRANCH=main"
                echo "LEGACY_DATA_DIR=backend/data"
                echo "RUNTIME_DATA_DIR=backend/runtime"
                echo "LEGACY_CONTAINER_PATTERN=^(nb-api|nb-twitch|nb-discord|nb-pg|nb-instafix)$"
                echo "COMPOSE_CHANGE_PATTERN=compose.prod.yaml"
                echo "PULL_ON_FORCE=true"
                echo "DEFAULT_SERVICES=api twitch discord instafix"
              } >> "$GITHUB_ENV"
              ;;
            staging)
              {
                echo "ENV_ALIAS=stg"
                echo "NIIBOT_ENV=stg"
                echo "COMPOSE_ENV_FILE=compose.stg.yaml"
                echo "COMPOSE_PROJECT=niibot-stg"
                echo "IMAGE_SUFFIX=-stg"
                echo "API_PORT=18001"
                echo "DEPLOY_BRANCH=staging"
                echo "LEGACY_DATA_DIR=data/staging/backend"
                echo "RUNTIME_DATA_DIR=data/staging/runtime"
                echo "LEGACY_CONTAINER_PATTERN=^(nb-api-stg|nb-twitch-stg|nb-discord-stg|nb-pg-stg|nb-instafix-stg)$"
                echo "COMPOSE_CHANGE_PATTERN=compose.stg.yaml"
                echo "PULL_ON_FORCE=false"
                echo "DEFAULT_SERVICES=api"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unknown environment '$DEPLOY_ENVIRONMENT' (expected production|staging)"
              exit 1
              ;;
          esac

      - name: Refuse running legacy stack
        run: |
          RUNNING=$(docker ps --format '{{.Names}}' | grep -E "$LEGACY_CONTAINER_PATTERN" || true)
          if [ -n "$RUNNING" ]; then
            echo "::error::legacy containers are still running; follow the one-time cutover runbook"
            echo "$RUNNING"
            exit 1
          fi

      - name: Pull latest code
        run: |
          PROJECT_PATH=$(cd "$PROJECT_DIR" && pwd -P)
          REPO_ROOT=$(git -C "$PROJECT_PATH" rev-parse --show-toplevel)
          REPO_ROOT=$(cd "$REPO_ROOT" && pwd -P)
          if [ "$PROJECT_PATH" != "$REPO_ROOT" ]; then
            echo "::error::PROJECT_DIR must point to the deployment worktree root"
            exit 1
          fi

          CURRENT_BRANCH=$(git -C "$PROJECT_PATH" symbolic-ref --quiet --short HEAD || true)
          if [ "$CURRENT_BRANCH" != "$DEPLOY_BRANCH" ]; then
            echo "::error::deployment checkout is on '$CURRENT_BRANCH'; expected '$DEPLOY_BRANCH'"
            exit 1
          fi

          git -C "$PROJECT_PATH" fetch --force --tags origin "$DEPLOY_BRANCH"
          git -C "$PROJECT_PATH" reset --hard "origin/$DEPLOY_BRANCH"

      - name: Write env files from secrets
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash "${PROJECT_DIR}/scripts/env/write_ci.sh"

      - name: Set build metadata
        id: meta
        run: |
          COMMIT=$(git -C "$PROJECT_DIR" rev-parse --short HEAD)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          RAW=$(git -C "$PROJECT_DIR" describe --tags --always 2>/dev/null || echo "dev")
          # v1.3.2-9-gabcdef → v1.3.9 (abcdef)   (3-segment tag with commits ahead)
          # v1.4-9-gabcdef   → v1.4.9 (abcdef)   (2-segment tag with commits ahead)
          # v1.3.2           → v1.3.0 (sha)       (exact 3-segment tag)
          # v1.4             → v1.4.0 (sha)       (exact 2-segment tag)
          VERSION=$(echo "$RAW" | sed -E \
            -e 's/^v([0-9]+)\.([0-9]+)\.[0-9]+-([0-9]+)-g([0-9a-f]+)$/v\1.\2.\3 (\4)/' \
            -e 's/^v([0-9]+)\.([0-9]+)-([0-9]+)-g([0-9a-f]+)$/v\1.\2.\3 (\4)/' \
            -e 's/^v([0-9]+)\.([0-9]+)\.[0-9]+$/v\1.\2.0 ('"$COMMIT"')/' \
            -e 's/^v([0-9]+)\.([0-9]+)$/v\1.\2.0 ('"$COMMIT"')/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect changed services
        id: changes
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          IS_SCHEDULED: ${{ inputs.is_scheduled }}
          SERVICES_INPUT: ${{ inputs.services }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          cd "$PROJECT_DIR"

          # Eligible set: the environment default, or an explicit `services` override.
          # "default" is the choice-input default the caller may forward verbatim.
          case "$SERVICES_INPUT" in
            ""|default) ELIGIBLE="$DEFAULT_SERVICES" ;;
            all)        ELIGIBLE="api twitch discord instafix" ;;
            *)          ELIGIBLE=$(echo "$SERVICES_INPUT" | tr ',' ' ') ;;
          esac
          eligible() { case " $ELIGIBLE " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          FORCE=false
          if [ "$FORCE_ALL" = "true" ] || [ "$IS_SCHEDULED" = "true" ]; then
            FORCE=true
          fi

          api=false; discord=false; twitch=false; instafix=false
          reason=path_filter
          [ "$FORCE" = "true" ] && reason=force || true

          if [ "$FORCE" = "true" ]; then
            eligible api      && api=true      || true
            eligible discord  && discord=true  || true
            eligible twitch   && twitch=true   || true
            eligible instafix && instafix=true || true
          else
            BASE_SHA="$GH_EVENT_BEFORE"
            # dispatch/schedule/workflow_call events don't carry event.before — fall back to HEAD~1
            [ -z "$BASE_SHA" ] && BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null) || true

            if [ -n "$CHANGED" ]; then
              # api/discord/twitch all build from ./backend with the root
              # pyproject.toml + uv.lock (see api/Dockerfile), so a change to
              # those shared dependency files must rebuild all three.
              PATTERN="^backend/shared/|^backend/uv\.lock$|^backend/pyproject\.toml$|^compose\.yaml$|^${COMPOSE_CHANGE_PATTERN}$|^env\.registry\.toml$|^env\.manifest\.json$|^scripts/env/ci\.py$|^scripts/env/write_ci\.sh$"

              if echo "$CHANGED" | grep -qE "$PATTERN"; then
                eligible api     && api=true     || true
                eligible discord && discord=true || true
                eligible twitch  && twitch=true  || true
              fi

              echo "$CHANGED" | grep -qE "^backend/api/"     && { eligible api     && api=true; }     || true
              echo "$CHANGED" | grep -qE "^backend/discord/" && { eligible discord && discord=true; } || true
              echo "$CHANGED" | grep -qE "^backend/twitch/"  && { eligible twitch  && twitch=true; }  || true

              # backend/scripts/ (incl. the migrate entrypoint + _lib) is baked
              # into the api image only — api/Dockerfile COPYs it, twitch/discord
              # don't. A change there must rebuild api or `run --rm migrate`
              # keeps executing the stale copy from the previous image.
              echo "$CHANGED" | grep -qE "^backend/scripts/" && { eligible api && api=true; } || true
            fi
          fi

          # Translate the slugs above into compose service names once, here.
          # They are not the same vocabulary — twitch/discord are twitch-bot/
          # discord-bot in Compose — and doing it separately in the
          # build and restart steps meant a new service had to be remembered in
          # two places, where missing one builds an image that never restarts.
          # instafix is an external image: it is pulled and restarted, never built.
          BUILD=""; RESTART=""
          [ "$api" = "true" ]      && { BUILD="$BUILD api";         RESTART="$RESTART api"; }         || true
          [ "$discord" = "true" ]  && { BUILD="$BUILD discord-bot"; RESTART="$RESTART discord-bot"; } || true
          [ "$twitch" = "true" ]   && { BUILD="$BUILD twitch-bot";  RESTART="$RESTART twitch-bot"; }  || true
          [ "$instafix" = "true" ] && RESTART="$RESTART instafix" || true

          echo "api=$api"                       >> "$GITHUB_OUTPUT"
          echo "discord=$discord"               >> "$GITHUB_OUTPUT"
          echo "twitch=$twitch"                 >> "$GITHUB_OUTPUT"
          echo "instafix=$instafix"             >> "$GITHUB_OUTPUT"
          echo "reason=$reason"                 >> "$GITHUB_OUTPUT"
          echo "eligible=$ELIGIBLE"             >> "$GITHUB_OUTPUT"
          echo "build_services=${BUILD# }"      >> "$GITHUB_OUTPUT"
          echo "restart_services=${RESTART# }"  >> "$GITHUB_OUTPUT"

      - name: Log planned changes
        run: |
          echo "eligible=${{ steps.changes.outputs.eligible }}"
          echo "api=${{ steps.changes.outputs.api }}"
          echo "discord=${{ steps.changes.outputs.discord }}"
          echo "twitch=${{ steps.changes.outputs.twitch }}"
          echo "instafix=${{ steps.changes.outputs.instafix }}"
          echo "reason=${{ steps.changes.outputs.reason }}"
          echo "build_services=${{ steps.changes.outputs.build_services }}"
          echo "restart_services=${{ steps.changes.outputs.restart_services }}"

      - name: Set compose flags
        run: |
          echo "PROJECT_FLAG=-p ${COMPOSE_PROJECT}" >> "$GITHUB_ENV"
          echo "ENV_FILE_FLAG=--env-file .env.${ENV_ALIAS}" >> "$GITHUB_ENV"

      - name: Save rollback point
        run: |
          SUFFIX="${IMAGE_SUFFIX}"
          for IMG in nb-api nb-discord nb-twitch; do
            FULL="${IMG}${SUFFIX}"
            ID=$(docker images "$FULL" --format "{{.ID}}" 2>/dev/null | head -1)
            [ -n "$ID" ] && docker tag "$ID" "${FULL}:rollback" && echo "Saved rollback: ${FULL}" || true
          done

      - name: Build images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICES="${{ steps.changes.outputs.build_services }}"

          if [ -z "$SERVICES" ]; then
            echo "No images to build, skipping."
            exit 0
          fi

          echo "Building: $SERVICES"

          PULL_FLAG=""
          [ "${PULL_ON_FORCE}" = "true" ] && \
            [ "${{ steps.changes.outputs.reason }}" = "force" ] && PULL_FLAG="--pull"

          docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} \
            ${PROJECT_FLAG:-} ${ENV_FILE_FLAG:-} build $PULL_FLAG $SERVICES \
            --build-arg "APP_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "GIT_COMMIT=${{ steps.meta.outputs.commit }}"

      - name: Scan images for CVEs
        run: |
          SUFFIX="${IMAGE_SUFFIX}"
          FAIL=false
          for IMG in \
            $([ "${{ steps.changes.outputs.api }}" = "true" ]       && echo "nb-api${SUFFIX}")       \
            $([ "${{ steps.changes.outputs.discord }}" = "true" ]   && echo "nb-discord${SUFFIX}")   \
            $([ "${{ steps.changes.outputs.twitch }}" = "true" ]    && echo "nb-twitch${SUFFIX}"); do
            echo "Scanning ${IMG} ..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --exit-code 1 \
              --severity CRITICAL \
              --scanners vuln \
              --ignore-status affected,will_not_fix,fix_deferred \
              --no-progress \
              "${IMG}" || FAIL=true
          done
          [ "$FAIL" = "true" ] && exit 1 || true

      - name: Tag images with version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SUFFIX="${IMAGE_SUFFIX}"
          VERSION="${{ steps.meta.outputs.version }}"
          DOCKER_TAG=$(echo "$VERSION" | sed 's/ (/-/; s/)//')
          [ "${{ steps.changes.outputs.api }}" = "true" ]       && docker tag "nb-api${SUFFIX}"       "nb-api${SUFFIX}:$DOCKER_TAG"       || true
          [ "${{ steps.changes.outputs.discord }}" = "true" ]   && docker tag "nb-discord${SUFFIX}"   "nb-discord${SUFFIX}:$DOCKER_TAG"   || true
          [ "${{ steps.changes.outputs.twitch }}" = "true" ]    && docker tag "nb-twitch${SUFFIX}"    "nb-twitch${SUFFIX}:$DOCKER_TAG"    || true
          echo "Tagged rebuilt images as :$DOCKER_TAG"

      - name: Migrate runtime data (idempotent)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          bash backend/scripts/runtime/migrate.sh "$LEGACY_DATA_DIR" "$RUNTIME_DATA_DIR"

      - name: Run migrations
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} \
            ${PROJECT_FLAG:-} ${ENV_FILE_FLAG:-} run --rm migrate

      - name: Restart changed services
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICES="${{ steps.changes.outputs.restart_services }}"

          if [ -z "$SERVICES" ]; then
            echo "No services to restart, skipping."
            exit 0
          fi

          echo "Restarting: $SERVICES"

          # instafix uses an external image — pull latest before restarting
          if [ "${{ steps.changes.outputs.instafix }}" = "true" ]; then
            docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} \
              ${PROJECT_FLAG:-} ${ENV_FILE_FLAG:-} pull instafix
          fi

          docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} \
            ${PROJECT_FLAG:-} ${ENV_FILE_FLAG:-} up -d ${SERVICES}

      - name: Health check
        id: healthcheck
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          COMPOSE_CMD="docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} ${PROJECT_FLAG} ${ENV_FILE_FLAG}"

          deadline=$((SECONDS + 120))
          until curl -sf "http://localhost:${API_PORT}/health" > /dev/null; do
            if [ $SECONDS -ge $deadline ]; then
              echo "ERROR: API did not respond within 120s"
              $COMPOSE_CMD ps
              $COMPOSE_CMD logs api --tail=30
              exit 1
            fi
            echo "Waiting for API... (${SECONDS}s elapsed)"
            sleep 5
          done
          echo "API liveness: OK"

          STATUS=$(curl -sf "http://localhost:${API_PORT}/status") || {
            echo "ERROR: API status endpoint is unavailable"
            $COMPOSE_CMD logs api --tail=30
            exit 1
          }

          if ! echo "$STATUS" | python3 -c \
            "import sys, json; d=json.load(sys.stdin); sys.exit(0 if d.get('db_connected') else 1)"; then
            echo "ERROR: API is up but db_connected=false"
            echo "$STATUS"
            $COMPOSE_CMD logs api --tail=30
            exit 1
          fi
          echo "API db_connected: OK"

          if [ "${{ steps.changes.outputs.api }}" = "true" ]; then
            EXPECTED_COMMIT="${{ steps.meta.outputs.commit }}"
            if ! echo "$STATUS" | EXPECTED_COMMIT="$EXPECTED_COMMIT" python3 -c \
              "import os,sys,json; d=json.load(sys.stdin); expected=os.environ['EXPECTED_COMMIT']; sys.exit(0 if d.get('git_commit') == expected else 1)"; then
              ACTUAL_COMMIT=$(echo "$STATUS" | python3 -c \
                "import sys,json; print(json.load(sys.stdin).get('git_commit', 'missing'))")
              echo "ERROR: API revision mismatch (expected=$EXPECTED_COMMIT actual=$ACTUAL_COMMIT)"
              $COMPOSE_CMD logs api --tail=30
              exit 1
            fi
            echo "API revision: OK ($EXPECTED_COMMIT)"
          fi

          check_private_health() {
            service="$1"; port="$2"
            if $COMPOSE_CMD ps --status running --services | grep -qx "$service"; then
              $COMPOSE_CMD exec -T "$service" python -c \
                "import urllib.request; urllib.request.urlopen('http://localhost:${port}/health').read()"
              echo "$service: OK"
            fi
          }
          check_private_health discord-bot 8080
          check_private_health twitch-bot 4344

      - name: Smoke test
        id: smoketest
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BASE="http://localhost:${API_PORT}"

          ROOT=$(curl -sf "${BASE}/")
          echo "$ROOT" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='running' else 1)" \
            || { echo "ERROR: GET / unexpected response: $ROOT"; exit 1; }
          echo "GET /: OK"

          PING=$(curl -sf "${BASE}/ping")
          [ "$PING" = "pong" ] || { echo "ERROR: GET /ping returned: $PING"; exit 1; }
          echo "GET /ping: OK"

      - name: Rollback on failure
        if: failure() && (steps.healthcheck.outcome == 'failure' || steps.smoketest.outcome == 'failure')
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SUFFIX="${IMAGE_SUFFIX}"
          SERVICES=""
          [ "${{ steps.changes.outputs.api }}" = "true" ]       && SERVICES="$SERVICES api"
          [ "${{ steps.changes.outputs.discord }}" = "true" ]   && SERVICES="$SERVICES discord-bot"
          [ "${{ steps.changes.outputs.twitch }}" = "true" ]    && SERVICES="$SERVICES twitch-bot"
          # instafix uses an external image — excluded from rollback

          [ -z "$SERVICES" ] && exit 0

          HAS_ROLLBACK=false
          for SVC in $SERVICES; do
            case $SVC in
              api)         IMG="nb-api${SUFFIX}" ;;
              discord-bot) IMG="nb-discord${SUFFIX}" ;;
              twitch-bot)  IMG="nb-twitch${SUFFIX}" ;;
            esac
            if docker image inspect "${IMG}:rollback" > /dev/null 2>&1; then
              docker tag "${IMG}:rollback" "${IMG}"
              HAS_ROLLBACK=true
              echo "Restored ${IMG} from :rollback"
            fi
          done

          if [ "$HAS_ROLLBACK" = "true" ]; then
            docker compose -f compose.yaml -f ${COMPOSE_ENV_FILE} \
              ${PROJECT_FLAG:-} ${ENV_FILE_FLAG:-} up -d ${SERVICES}
            echo "Rollback complete. NOTE: DB migrations were not rolled back."
          else
            echo "No :rollback images found — this may be the first deploy."
          fi

      - name: Notify deploy failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          GH_SVC_API: ${{ steps.changes.outputs.api }}
          GH_SVC_TWITCH: ${{ steps.changes.outputs.twitch }}
          GH_SVC_DISCORD: ${{ steps.changes.outputs.discord }}
          GH_SVC_INSTAFIX: ${{ steps.changes.outputs.instafix }}
        run: |
          [ -z "${WEBHOOK_URL}" ] && { echo "DEPLOY_WEBHOOK_URL not set, skipping."; exit 0; }
          REASON="build or migration error"
          [ "${{ steps.healthcheck.outcome }}" = "failure" ] && REASON="health check failed"
          export GH_ENV="${{ inputs.environment }}"
          export GH_COMMIT="${{ steps.meta.outputs.commit }}"
          export GH_ACTOR="${{ github.actor }}"
          export GH_REASON="$REASON"
          export GH_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - <<'PYEOF' | curl -s -X POST "${WEBHOOK_URL}" -H "Content-Type: application/json" -d @-
          import json, os
          from datetime import datetime, timezone, timedelta
          e = os.environ
          svc_map = [('GH_SVC_API','API'),('GH_SVC_TWITCH','Twitch'),('GH_SVC_DISCORD','Discord'),('GH_SVC_INSTAFIX','Instafix')]
          svcs = ', '.join(label for key, label in svc_map if e.get(key) == 'true') or 'none'
          payload = {
            "embeds": [{
              "author": {"name": "Niibot CI/CD"},
              "title": f"Deploy failed: {e['GH_ENV']}",
              "url": e["GH_RUN_URL"],
              "color": 15158332,
              "fields": [
                {"name": "Reason",   "value": e["GH_REASON"],        "inline": True},
                {"name": "Commit",   "value": f"`{e['GH_COMMIT']}`", "inline": True},
                {"name": "Actor",    "value": e["GH_ACTOR"],         "inline": True},
                {"name": "Services", "value": svcs,                  "inline": False},
              ],
              "footer": {"text": "GitHub Actions"},
              "timestamp": datetime.now(timezone(timedelta(hours=8))).isoformat(),
            }]
          }
          print(json.dumps(payload))
          PYEOF

      - name: Prune old images
        run: |
          docker image prune -f

          SUFFIX="${IMAGE_SUFFIX}"
          # tail -n +4 keeps 3 most recent; no sort needed (docker images outputs newest-first; BSD sort -V unavailable on macOS)
          for IMAGE in nb-api nb-twitch nb-discord; do
            docker images "${IMAGE}${SUFFIX}" --format "{{.Tag}}" \
              | grep -vE "^(latest|rollback)$" \
              | tail -n +4 \
              | xargs -I{} docker rmi "${IMAGE}${SUFFIX}:{}" 2>/dev/null || true
          done

      - name: Notify deploy success
        if: success()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          GH_SVC_API: ${{ steps.changes.outputs.api }}
          GH_SVC_TWITCH: ${{ steps.changes.outputs.twitch }}
          GH_SVC_DISCORD: ${{ steps.changes.outputs.discord }}
          GH_SVC_INSTAFIX: ${{ steps.changes.outputs.instafix }}
        run: |
          [ -z "${WEBHOOK_URL}" ] && { echo "DEPLOY_WEBHOOK_URL not set, skipping."; exit 0; }
          export GH_ENV="${{ inputs.environment }}"
          export GH_VERSION="${{ steps.meta.outputs.version }}"
          export GH_ACTOR="${{ github.actor }}"
          export GH_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - <<'PYEOF' | curl -s -X POST "${WEBHOOK_URL}" -H "Content-Type: application/json" -d @-
          import json, os
          from datetime import datetime, timezone, timedelta
          e = os.environ
          svc_map = [('GH_SVC_API','API'),('GH_SVC_TWITCH','Twitch'),('GH_SVC_DISCORD','Discord'),('GH_SVC_INSTAFIX','Instafix')]
          svcs = ', '.join(label for key, label in svc_map if e.get(key) == 'true') or 'none'
          payload = {
            "embeds": [{
              "author": {"name": "Niibot CI/CD"},
              "title": f"Deployed: {e['GH_ENV']}",
              "url": e["GH_RUN_URL"],
              "color": 3066993,
              "fields": [
                {"name": "Version",  "value": f"`{e['GH_VERSION']}`", "inline": True},
                {"name": "Actor",    "value": e["GH_ACTOR"],          "inline": True},
                {"name": "Services", "value": svcs,                   "inline": False},
              ],
              "footer": {"text": "GitHub Actions"},
              "timestamp": datetime.now(timezone(timedelta(hours=8))).isoformat(),
            }]
          }
          print(json.dumps(payload))
          PYEOF
