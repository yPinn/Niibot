version: 2
updates:
  # Backend (FastAPI / discord.py / TwitchIO) — managed by uv.lock
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Scrapling sidecar — separate uv.lock
  - package-ecosystem: "uv"
    directory: "/backend/scrapling"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    groups:
      scrapling-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      scrapling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend (React / TypeScript / Vite)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    groups:
      actions:
        patterns:
          - "*"
