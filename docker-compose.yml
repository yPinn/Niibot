x-db-env: &docker-db-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set in root .env (see .env.example)}

# API service URLs — code defaults to localhost; containers must use service names.
x-api-svc-urls: &docker-api-svc-urls
  TWITCH_BOT_URL: http://twitch-bot:4344
  DISCORD_BOT_URL: http://discord-bot:8080

# Discord bot service URLs — INSTAFIX_HOST already defaults to Docker name in code.
# SCRAPLING_HOST has no default; override to use service name in Docker.
x-discord-svc-urls: &docker-discord-svc-urls
  SCRAPLING_HOST: scrapling:${SCRAPLING_PORT:-3001}

x-healthcheck: &default-healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s

# ---------------------------------------------------------------------------
# Profiles guide:
#   --profile api      → API + DB
#   --profile twitch   → Twitch bot + DB
#   --profile discord  → Discord bot + DB + Instafix + Scrapling
#   --profile bots     → All bots + DB + Instafix + Scrapling
#   --profile full     → Everything
#
# No profile / postgres only:
#   docker compose up postgres   → DB only (useful when running backend locally)
#
# Note: frontend is deployed on Cloudflare Pages, not via Docker.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    container_name: niibot-postgres
    restart: unless-stopped
    command: >
      postgres
        -c log_min_duration_statement=500
        -c log_line_prefix='%m [%p] '
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in root .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in root .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - niibot-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: niibot-api
    build:
      context: ./backend
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-migrate
    command: python /app/scripts/db_migrate.py
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env
    environment:
      <<: *docker-db-env
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  instafix:
    image: ghcr.io/wikidepia/instafix:main
    container_name: niibot-instafix
    restart: unless-stopped
    profiles: [discord, bots, full]
    networks:
      - niibot-network

  scrapling:
    image: niibot-scrapling
    build:
      context: ./backend
      dockerfile: scrapling/Dockerfile
    container_name: niibot-scrapling
    restart: unless-stopped
    profiles: [discord, bots, full]
    env_file:
      - ./backend/scrapling/.env
    environment:
      PORT: ${SCRAPLING_PORT:-3001}
      COOKIES_PATH: /app/cookies/session.json
    volumes:
      - scrapling-cookies:/app/cookies
    networks:
      - niibot-network
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${SCRAPLING_PORT:-3001}/health').read()",
        ]

  twitch-bot:
    image: niibot-twitch
    build:
      context: ./backend
      dockerfile: twitch/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-twitch
    restart: unless-stopped
    profiles: [twitch, bots, full]
    env_file:
      - ./backend/shared.env
      - ./backend/twitch/.env
    environment:
      <<: *docker-db-env
    volumes:
      - ./backend/data:/app/data
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4344/health').read()",
        ]

  discord-bot:
    image: niibot-discord
    build:
      context: ./backend
      dockerfile: discord/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-discord
    restart: unless-stopped
    profiles: [discord, bots, full]
    env_file:
      - ./backend/shared.env
      - ./backend/discord/.env
    environment:
      <<: [*docker-db-env, *docker-discord-svc-urls]
    volumes:
      - ./backend/data:/app/data
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      instafix:
        condition: service_started
      scrapling:
        condition: service_started
        required: false
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()",
        ]

  api:
    image: niibot-api
    build:
      context: ./backend
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-api
    restart: unless-stopped
    profiles: [api, full]
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env
    environment:
      <<: [*docker-db-env, *docker-api-svc-urls]
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]

volumes:
  scrapling-cookies:

networks:
  niibot-network:
    driver: bridge
