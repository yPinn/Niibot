x-healthcheck: &default-healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  instafix:
    image: ghcr.io/wikidepia/instafix:main
    container_name: niibot-instafix
    restart: unless-stopped
    networks:
      - niibot-network

  scrapling:
    image: niibot-scrapling
    build:
      context: ./backend
      dockerfile: scrapling/Dockerfile
    container_name: niibot-scrapling
    restart: unless-stopped
    environment:
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - niibot-network
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3001/health').read()",
        ]

  postgres:
    image: postgres:16
    container_name: niibot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - niibot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: niibot-api
    container_name: niibot-migrate
    command: python /app/scripts/db_migrate.py
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  twitch-bot:
    image: niibot-twitch
    build:
      context: ./backend
      dockerfile: twitch/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-twitch
    restart: unless-stopped
    env_file:
      - ./backend/shared.env
      - ./backend/twitch/.env
    volumes:
      - ./backend/data:/app/data
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4344/health').read()",
        ]

  discord-bot:
    image: niibot-discord
    build:
      context: ./backend
      dockerfile: discord/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-discord
    restart: unless-stopped
    env_file:
      - ./backend/shared.env
      - ./backend/discord/.env
    volumes:
      - ./backend/data:/app/data
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      instafix:
        condition: service_started
      scrapling:
        condition: service_started
        required: false
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()",
        ]

  api:
    image: niibot-api
    build:
      context: ./backend
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: niibot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/shared.env
      - ./backend/api/.env
    volumes:
      - ./backend/data:/app/data
    networks:
      - niibot-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]

networks:
  niibot-network:
    driver: bridge
