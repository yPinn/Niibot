x-db-env: &docker-db-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set in root .env (see .env.example)}

# API service URLs — code defaults to localhost; containers must use service names.
x-api-svc-urls: &docker-api-svc-urls
  TWITCH_BOT_URL: http://twitch-bot:4344
  DISCORD_BOT_URL: http://discord-bot:8080

x-healthcheck: &default-healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

# ---------------------------------------------------------------------------
# Profiles guide:
#   --profile api      → API + DB
#   --profile twitch   → Twitch bot + DB
#   --profile discord  → Discord bot + DB + Instafix
#   --profile bots     → All bots + DB + Instafix
#   --profile full     → Everything
#
# No profile / postgres only:
#   docker compose up postgres   → DB only (useful when running backend locally)
#
# Note: frontend is deployed on Cloudflare Pages, not via Docker.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    container_name: nb-pg
    restart: unless-stopped
    logging: *default-logging
    command: >
      postgres
        -c log_min_duration_statement=500
        -c log_line_prefix='%m [%p] '
    networks:
      - nb-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in root .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in root .env}

  migrate:
    image: nb-api
    build:
      context: ./backend
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: nb-migrate
    command: python /app/scripts/db_migrate.py
    restart: "no"
    logging: *default-logging
    networks:
      - nb-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *docker-db-env

  instafix:
    image: ghcr.io/wikidepia/instafix:main
    container_name: nb-instafix
    restart: unless-stopped
    logging: *default-logging
    profiles: [discord, bots, full]
    networks:
      - nb-network

  twitch-bot:
    image: nb-twitch
    build:
      context: ./backend
      dockerfile: twitch/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: nb-twitch
    restart: unless-stopped
    logging: *default-logging
    profiles: [twitch, bots, full]
    networks:
      - nb-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4344/health').read()",
        ]
    environment:
      <<: *docker-db-env

  discord-bot:
    image: nb-discord
    build:
      context: ./backend
      dockerfile: discord/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: nb-discord
    restart: unless-stopped
    logging: *default-logging
    profiles: [discord, bots, full]
    networks:
      - nb-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      instafix:
        condition: service_started
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()",
        ]
    environment:
      <<: *docker-db-env

  api:
    image: nb-api
    build:
      context: ./backend
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: nb-api
    restart: unless-stopped
    logging: *default-logging
    profiles: [api, full]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nb-network
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *default-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
    environment:
      <<: [*docker-db-env, *docker-api-svc-urls]

networks:
  nb-network:
    driver: bridge
